name: Node LTS LIVE safety checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  syntax-and-logic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate Node and browser JS syntax
        run: |
          node --check server.js
          node --check browser-auth.js
          node --check live-ops.js
          node --check public/js/live.js
          node --check public/js/audio.js
          node --check public/js/browser-login.js
      - name: Run LIVE behavior and burst-load unit tests
        run: node --test tests/*.test.js
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies exactly as BAT-LIVE does
        run: npm ci --no-audit --no-fund
      - name: Boot Node server with only the required Node LTS runtime
        run: node scripts/smoke-start.js
